name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PostgreSQL API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sleephaven
          POSTGRES_PASSWORD: sleephaven_ci
          POSTGRES_DB: sleephaven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleephaven -d sleephaven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SLEEPHAVEN_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=sleephaven_test;Username=sleephaven;Password=sleephaven_ci;Pooling=false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend tests
        run: >-
          dotnet restore SleepHaven.Api.Tests/SleepHaven.Api.Tests.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Test API against PostgreSQL
        run: dotnet test SleepHaven.Api.Tests/SleepHaven.Api.Tests.csproj --configuration Release --no-restore

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
      RUNTIME_ID: win-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore tests
        run: >-
          dotnet restore SleepHaven.Tests/SleepHaven.Tests.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Test
        run: dotnet test SleepHaven.Tests/SleepHaven.Tests.csproj --configuration Release --no-restore

      - name: Restore Windows app
        run: >-
          dotnet restore SleepHaven.csproj
          --no-dependencies
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -r ${{ env.RUNTIME_ID }}
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: >-
          dotnet build SleepHaven.csproj
          -c Release
          -f ${{ env.TARGET_FRAMEWORK }}
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -p:RuntimeIdentifier=${{ env.RUNTIME_ID }}
          --no-restore

  android:
    name: Android build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_FRAMEWORK: net10.0-android
      RUNTIME_ID: android-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore core
        run: >-
          dotnet restore SleepHaven.Core/SleepHaven.Core.csproj
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Restore Android app
        run: >-
          dotnet restore SleepHaven.csproj
          --no-dependencies
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -r ${{ env.RUNTIME_ID }}
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: >-
          dotnet build SleepHaven.csproj
          -c Release
          -f ${{ env.TARGET_FRAMEWORK }}
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -p:RuntimeIdentifier=${{ env.RUNTIME_ID }}
          --no-restore
