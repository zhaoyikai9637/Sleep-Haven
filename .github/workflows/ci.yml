name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
      RUNTIME_ID: win-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore
        run: >-
          dotnet restore SleepHaven.csproj
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -r ${{ env.RUNTIME_ID }}
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: >-
          dotnet build SleepHaven.csproj
          -c Release
          -f ${{ env.TARGET_FRAMEWORK }}
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -p:RuntimeIdentifier=${{ env.RUNTIME_ID }}
          --no-restore

  android:
    name: Android build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_FRAMEWORK: net10.0-android
      RUNTIME_ID: android-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore
        run: >-
          dotnet restore SleepHaven.csproj
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -r ${{ env.RUNTIME_ID }}
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: >-
          dotnet build SleepHaven.csproj
          -c Release
          -f ${{ env.TARGET_FRAMEWORK }}
          -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }}
          -p:RuntimeIdentifier=${{ env.RUNTIME_ID }}
          --no-restore
