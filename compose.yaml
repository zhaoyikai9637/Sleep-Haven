services:
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sleephaven
      POSTGRES_USER: sleephaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sleephaven_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleephaven -d sleephaven"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: SleepHaven.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Catalog: Host=database;Port=5432;Database=sleephaven;Username=sleephaven;Password=${POSTGRES_PASSWORD}
    ports:
      - "5080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  sleephaven_postgres:
